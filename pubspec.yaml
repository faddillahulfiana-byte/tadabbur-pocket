name: tadabbur_pocket
description: "Aplikasi Android untuk menjaga hafalan Al-Qur'an dan tadabbur ringkas dengan Supabase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend & State Management
  supabase_flutter: ^2.8.0
  provider: ^6.1.2

  # Pengingat & Notifikasi Lokal Android
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # UI & Utilitas
  google_fonts: ^6.2.1
  intl: ^0.20.3
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
